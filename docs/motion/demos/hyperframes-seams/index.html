<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      body { font-family: "Inter", sans-serif; }
      #root { position: relative; width: 1920px; height: 1080px; background: #000000; }
      .clip { position: absolute; inset: 0; }
      .wrap { position: absolute; inset: 0; }
      .center { display: flex; align-items: center; justify-content: center; }
      .word { font-size: 132px; font-weight: 500; color: #ffffff; letter-spacing: -0.02em; }
      .words { display: flex; gap: 38px; }
      video { width: 1920px; height: 1080px; object-fit: cover; }
      .scrim {
        position: absolute; inset: 0;
        background: linear-gradient(0deg, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.38) 26%, rgba(0,0,0,0) 50%);
      }
      .label { position: absolute; left: 154px; bottom: 170px; }
      .label .name { font-size: 88px; font-weight: 600; color: #ffffff; letter-spacing: -0.01em; }
      .label .line { font-size: 40px; font-weight: 400; color: rgba(255,255,255,0.72); margin-top: 8px; }
      #close-bg { position: absolute; inset: 0; background: #000000; }
      #logo { height: 100px; width: auto; filter: brightness(0) invert(1); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1920" data-height="1080">
      <div id="bg" class="clip" data-start="0" data-duration="9" data-track-index="0" style="background: #000000; z-index: 0;"></div>

      <!-- Shot A: drone, Host -->
      <div id="wrap-a" class="wrap" style="z-index: 1;">
        <video id="clip-a" class="clip" src="assets/drone.mp4" muted playsinline data-start="2.0" data-duration="2.95" data-track-index="1"></video>
        <div id="scrim-a" class="clip scrim" data-start="2.0" data-duration="2.95" data-track-index="2"></div>
        <div id="label-a" class="clip" data-start="2.3" data-duration="2.65" data-track-index="3">
          <div class="label">
            <div class="name">Host</div>
            <div class="line">The whole of hosting, automated</div>
          </div>
        </div>
      </div>

      <!-- Shot B: door, Stay -->
      <div id="wrap-b" class="wrap" style="z-index: 2;">
        <video id="clip-b" class="clip" src="assets/door.mp4" muted playsinline data-start="4.6" data-duration="2.6" data-track-index="4"></video>
        <div id="scrim-b" class="clip scrim" data-start="4.6" data-duration="2.6" data-track-index="5"></div>
        <div id="label-b" class="clip" data-start="4.95" data-duration="2.25" data-track-index="6">
          <div class="label">
            <div class="name">Stay</div>
            <div class="line">Managed stays you book once</div>
          </div>
        </div>
      </div>

      <!-- Opening type, above the incoming clip during the seam -->
      <div id="type" class="clip center" data-start="0" data-duration="2.35" data-track-index="7" style="z-index: 3;">
        <div class="words">
          <span class="word" id="w1">Everything</span>
          <span class="word" id="w2">around</span>
          <span class="word" id="w3">stays</span>
        </div>
      </div>

      <!-- Close: opaque black, logo only -->
      <div id="close" class="clip center" data-start="6.9" data-duration="2.1" data-track-index="8" style="z-index: 4;">
        <div id="close-bg"></div>
        <img id="logo" src="assets/hububb-wordmark.svg" alt="" style="position: relative;" />
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Waterfall entry: words cascade in on opacity and travel only.
      // Letters are never scaled or stretched.
      tl.fromTo("#w1", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.42, ease: "power4.out" }, 0.05);
      tl.fromTo("#w2", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.42, ease: "power4.out" }, 0.2);
      tl.fromTo("#w3", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.42, ease: "power4.out" }, 0.35);

      // Seam 1 (2.0-2.35): zoom-through into the drone shot. The whole type
      // layer drives toward camera and defocuses while the footage lands from
      // slightly above 1, mirrored eases so velocity matches at the cut.
      tl.to("#type", { scale: 1.5, opacity: 0, filter: "blur(18px)", duration: 0.35, ease: "power4.in" }, 2.0);
      tl.fromTo("#wrap-a", { scale: 1.16, filter: "blur(14px)" }, { scale: 1, filter: "blur(0px)", duration: 0.4, ease: "power4.out" }, 2.05);

      // Host label rises on opacity and travel.
      tl.fromTo("#label-a .label", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" }, 2.35);

      // Seam 2 (4.6-4.95): rack-focus cut. Shot A falls out of focus, shot B
      // resolves from the same defocus, no movement in either plate.
      tl.to("#wrap-a", { filter: "blur(18px)", duration: 0.3, ease: "power2.in" }, 4.6);
      tl.fromTo("#wrap-b", { filter: "blur(18px)" }, { filter: "blur(0px)", duration: 0.35, ease: "power2.out" }, 4.65);

      tl.fromTo("#label-b .label", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" }, 5.0);

      // Seam 3 (6.9-7.2): inverse zoom-through to black; the shot leaves
      // toward camera as the close resolves. Logo enters on travel only.
      tl.to("#wrap-b", { scale: 1.3, filter: "blur(16px)", duration: 0.35, ease: "power4.in" }, 6.9);
      tl.fromTo("#close", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 6.95);
      tl.fromTo("#logo", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 7.15);

      tl.to("#bg", { opacity: 1, duration: 0.01 }, 8.99);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
